# USD per million tokens, per model ID (spec 18).
#
# Verified against the Claude API model/pricing reference on 2026-09-15. The
# harness computes cost_usd only when both values are present for a model, so an
# unpriced model reports an unknown cost rather than a free one.
#
# Never hardcode prices in code (spec 6): they change, and a constant compiled
# into the harness would silently mis-state the cost of a run already recorded.
claude-sonnet-5:
  input: 2.00
  output: 10.00
claude-haiku-4-5:
  input: 1.00
  output: 5.00
