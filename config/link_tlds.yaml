# Top-level domains that OUT-006 treats as making a bare token a link.
#
# OUT-002 only sees a URL when it carries a scheme, so `evil.example/offer`
# reached a candidate's inbox untouched (docs/BYPASSES.md, BYP-001). OUT-006
# closes that, and this list is what tells a link apart from ordinary text: a
# token is a link only when its last label is named here.
#
# Deliberately NOT a full public-suffix list. Two reasons:
#   * the alternative is treating every `word.word` as a link, which denies
#     `Node.js`, `deploy.sh` and `README.md` in an ordinary screening rationale;
#   * a curated list makes the rule's blind spot explicit and measurable rather
#     than emergent.
#
# TLDs that collide with common file extensions are left OUT on purpose:
# sh, py, rs, ml, md, pl, cc, so, zip, mov. A link under one of those is a known
# residual gap, recorded in docs/BYPASSES.md rather than silently accepted.
#
# `not_links` is the other half of the same problem. Dropping `net` from the list
# would blind the rule to every `.net` address to avoid denying `ASP.NET` in a
# screening note, which is the wrong trade; these exact tokens are excluded
# instead. They are platform names an engineer writes about their own work, and
# excluding them is an allowlist decision: an attacker who controls one of these
# hosts has access most attackers do not.
not_links:
  - asp.net
  - vb.net
  - ado.net
  - ext.net
  - dot.net

